name: 🔑 Generate Keystore & Base64

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Store Password'
        required: true
        default: 'NexusPass2026'
      key_alias:
        description: 'Key Alias'
        required: true
        default: 'nexus_key'
      key_password:
        description: 'Key Password'
        required: true
        default: 'NexusPass2026'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Generate Keystore File
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ github.event.inputs.store_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=Nexus, OU=Factory, O=Royal, L=City, S=State, C=US"

      - name: 🔐 Convert Keystore to Base64
        run: |
          base64 -w 0 release.keystore > keystore_base64.txt
          echo "==================== KEYSTORE BASE64 STRING ===================="
          cat keystore_base64.txt
          echo ""
          echo "================================================================"

      - name: 📦 Upload Artifacts (Keystore File & Base64 Text)
        uses: actions/upload-artifact@v4
        with:
          name: generated-keystore-data
          path: |
            release.keystore
            keystore_base64.txt
